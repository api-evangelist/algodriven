aid: algodriven
name: AlgoDriven
description: >-
  AlgoDriven is an automotive AI company that helps car dealerships, banks,
  insurers, fleet operators, marketplaces, and OEMs appraise, inspect, and price
  used vehicles using proprietary data-driven applications. Its products include
  EvalExpert (automated car valuation and price guide built on millions of data
  points), DriveExpert (test-drive, loan-car, and staff-car management with
  analytics), and InspectExpert (customised vehicle inspection software), backed
  by developer APIs for vehicle search and data, valuations, specifications, and
  vehicle history reports. Founded in 2017 and expanded across the MENA region,
  New Zealand, and beyond, AlgoDriven runs offices in Australia, the UAE, and
  Egypt, and is a portfolio company of 500 Global.
